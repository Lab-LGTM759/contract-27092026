<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TangemGaslessDynamicEscrow Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>TangemGaslessDynamicEscrow Management</h1>
        
        <!-- Секция 4: Управление кошельками (5 получателей) -->
        <div class="card">
            <h2>4. Payee Wallets Management (3-of-3) / Управление кошельками</h2>
            
            <div class="input-group">
                <label>0. Investor / Инвестор (5.00% / 500 BPS):</label>
                <input type="text" id="payee0" placeholder="T...">
            </div>

            <div class="input-group">
                <label>1. Oracle / Оракул (1.75% / 175 BPS):</label>
                <input type="text" id="payee1" placeholder="T...">
            </div>

            <div class="input-group">
                <label>2. Participant #0 / Участник №0 (1.75% / 175 BPS):</label>
                <input type="text" id="payee2" placeholder="T...">
            </div>

            <div class="input-group">
                <label>3. Participant #1 / Участник №1 (1.50% / 150 BPS):</label>
                <input type="text" id="payee3" placeholder="T...">
            </div>

            <div class="input-group">
                <label>4. Participant #2 / Участник №2 (1.00% / 100 BPS):</label>
                <input type="text" id="payee4" placeholder="T...">
            </div>

            <button id="updatePayeesBtn">Update Payee Wallets / Обновить кошельки</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
